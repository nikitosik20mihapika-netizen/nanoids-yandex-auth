<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Nanoids — вход через Яндекс</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; background: #0d1b2a; color: #ecf0f1;
      font: 16px/1.5 system-ui, sans-serif; text-align: center;
    }
    main { width: min(100%, 390px); }
    h1 { margin: 0 0 12px; font-size: 28px; }
    p { color: #bdc7d1; overflow-wrap: anywhere; }
    button {
      display: none; margin: 18px auto 0; padding: 12px 18px;
      border: 0; border-radius: 10px; background: #fc3f1d;
      color: white; font-weight: 700; font-size: 16px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Nanoids</h1>
    <p id="status">Завершаем вход через Яндекс…</p>
    <button id="copy" type="button">Скопировать токен для ручного входа</button>
  </main>
  <script>
  (function () {
    'use strict';
    var status = document.getElementById('status');
    var copyButton = document.getElementById('copy');
    var params = new URLSearchParams((location.hash || '').replace(/^#/, ''));
    if (!params.has('access_token')) {
      params = new URLSearchParams((location.search || '').replace(/^\?/, ''));
    }

    var token = params.get('access_token') || params.get('token') || '';
    var state = params.get('state') || '';
    var oauthError = params.get('error_description') || params.get('error');

    if (oauthError) {
      status.textContent = 'Яндекс не завершил авторизацию: ' + oauthError;
      return;
    }
    if (!token) {
      status.textContent = 'Токен не найден. Закрой окно и попробуй войти ещё раз.';
      return;
    }

    var message = {
      type: 'nano_yandex_auth',
      access_token: token,
      state: state
    };

    try {
      if (window.opener && !window.opener.closed) {
        window.opener.postMessage(message, '*');
        status.textContent = 'Токен передан в Nanoids. Это окно можно закрыть.';
        setTimeout(function () {
          try { window.close(); } catch (e) {}
        }, 900);
        return;
      }
    } catch (e) {}

    // Резервный путь для среды, которая умеет открывать nanoids:// deep links.
    try {
      location.href = 'nanoids://oauth#access_token=' +
        encodeURIComponent(token) + '&state=' + encodeURIComponent(state);
    } catch (e) {}

    status.textContent =
      'Браузер не сообщил игре о входе автоматически. Можно скопировать токен и вставить его в окне ручного входа Nanoids.';
    copyButton.style.display = 'inline-block';
    copyButton.addEventListener('click', function () {
      var done = function () { status.textContent = 'Токен скопирован. Вернись в Nanoids и вставь его в поле ручного входа.'; };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(token).then(done).catch(function () {
          status.textContent = 'Не удалось скопировать автоматически. Разреши доступ к буферу обмена или повтори вход из игры.';
        });
      } else {
        status.textContent = 'Буфер обмена недоступен в этом браузере. Повтори вход из игры.';
      }
    });
  })();
  </script>
</body>
</html>

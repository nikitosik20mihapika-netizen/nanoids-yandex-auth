<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Nanoids — вход</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; background: #0d1b2a; color: #ecf0f1;
      font: 16px/1.5 system-ui, sans-serif; text-align: center;
    }
    main { width: min(100%, 400px); }
    h1 { margin: 0 0 12px; font-size: 26px; }
    p { color: #bdc7d1; overflow-wrap: anywhere; margin: 0 0 10px; }
    .ok { color: #2ecc71; font-weight: 700; font-size: 18px; }
    .err { color: #e74c3c; }
    .muted { color: #7f8c9b; font-size: 14px; }
    .row { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
    button {
      padding: 14px 18px; border: 0; border-radius: 12px;
      font-weight: 700; font-size: 16px; cursor: pointer;
      display: none;
    }
    #confirm { background: #27ae60; color: #fff; }
    #copy { background: #34495e; color: #fff; }
    .spinner {
      width: 36px; height: 36px; margin: 16px auto;
      border: 3px solid rgba(255,255,255,.15);
      border-top-color: #5dade2; border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main>
    <h1>Nanoids</h1>
    <div id="spinWrap"><div class="spinner"></div></div>
    <p id="status">Проверяем вход в аккаунт…</p>
    <div class="row">
      <button id="confirm" type="button">Вернуться в игру</button>
      <button id="copy" type="button">Скопировать токен</button>
    </div>
  </main>
  <script>
  (function () {
    'use strict';
    var EDGE = 'https://nwfrswfidmgfiztutbvk.supabase.co/functions/v1/yandex-auth';
    var statusEl = document.getElementById('status');
    var confirmBtn = document.getElementById('confirm');
    var copyBtn = document.getElementById('copy');
    var spinWrap = document.getElementById('spinWrap');

    var params = new URLSearchParams((location.hash || '').replace(/^#/, ''));
    if (!params.has('access_token')) {
      params = new URLSearchParams((location.search || '').replace(/^\?/, ''));
    }

    var token = params.get('access_token') || params.get('token') || '';
    var state = params.get('state') || '';
    var oauthError = params.get('error_description') || params.get('error');
    var loginOk = false;

    function setStatus(text, cls) {
      statusEl.className = cls || '';
      statusEl.textContent = text;
    }

    function gameReturnUrl() {
      return 'https://appassets.androidplatform.net/assets/index.html#nano_oauth=' +
        encodeURIComponent(token) +
        (state ? ('&nano_state=' + encodeURIComponent(state)) : '');
    }

    function notifyGame() {
      try {
        if (window.opener && !window.opener.closed) {
          window.opener.postMessage({
            type: 'nano_yandex_auth',
            access_token: token,
            state: state
          }, '*');
          return true;
        }
      } catch (e) {}
      return false;
    }

    function showLoginSuccess(name) {
      spinWrap.style.display = 'none';
      loginOk = true;
      setStatus(name ? ('Вход: ' + name) : 'Вход: аккаунт Яндекс', 'ok');
      confirmBtn.style.display = 'block';
      // без авто-перехода — только кнопка
    }

    function showFail(msg) {
      spinWrap.style.display = 'none';
      loginOk = false;
      setStatus(msg || 'Не удалось войти.', 'err');
      confirmBtn.style.display = 'none';
      copyBtn.style.display = 'block';
    }

    function verifyAccount() {
      return fetch(EDGE, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ access_token: token })
      }).then(function (res) {
        return res.json().then(function (data) {
          if (data && data.ok && data.user_id) return data;
          throw new Error((data && data.error) || 'edge');
        });
      }).catch(function () {
        return fetch('https://login.yandex.ru/info?format=json', {
          headers: { Authorization: 'OAuth ' + token }
        }).then(function (res) {
          if (!res.ok) throw new Error('yandex_invalid');
          return res.json();
        }).then(function (info) {
          if (!info || !(info.id || info.psuid)) throw new Error('no_id');
          var name = [info.first_name, info.last_name].filter(Boolean).join(' ') || info.login || '';
          return { ok: true, user_id: 'ya_' + (info.id || info.psuid), display_name: name };
        });
      });
    }

    if (oauthError) { showFail('Яндекс отклонил вход: ' + oauthError); return; }
    if (!token) { showFail('Токен не получен. Войди снова из игры.'); return; }

    confirmBtn.addEventListener('click', function () {
      if (!loginOk) return;
      notifyGame();
      if (window.opener && !window.opener.closed) {
        try { window.close(); } catch (e) {}
        return;
      }
      // только по кнопке
      location.replace(gameReturnUrl());
    });

    copyBtn.addEventListener('click', function () {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(token).then(function () {
          setStatus('Токен скопирован.', 'muted');
        });
      }
    });

    verifyAccount().then(function (data) {
      showLoginSuccess((data && (data.display_name || data.login)) || '');
      notifyGame();
    }).catch(function () {
      showFail('Вход не удался. Попробуй ещё раз из игры.');
    });
  })();
  </script>
</body>
</html>

<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Nanoids — вход</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; background: #0d1b2a; color: #ecf0f1;
      font: 16px/1.5 system-ui, sans-serif; text-align: center;
    }
    main { width: min(100%, 400px); }
    h1 { margin: 0 0 12px; font-size: 26px; }
    p { color: #bdc7d1; overflow-wrap: anywhere; margin: 0 0 10px; }
    .ok { color: #2ecc71; }
    .err { color: #e74c3c; }
    .row { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
    button {
      padding: 14px 18px; border: 0; border-radius: 12px;
      font-weight: 700; font-size: 16px; cursor: pointer;
    }
    #confirm { background: #27ae60; color: #fff; }
    #copy { background: #34495e; color: #fff; display: none; }
  </style>
</head>
<body>
  <main>
    <h1>Nanoids</h1>
    <p id="status">Завершаем вход через Яндекс…</p>
    <div class="row">
      <button id="confirm" type="button">Вернуться в игру</button>
      <button id="copy" type="button">Скопировать токен</button>
    </div>
  </main>
  <script>
  (function () {
    'use strict';
    var statusEl = document.getElementById('status');
    var confirmBtn = document.getElementById('confirm');
    var copyBtn = document.getElementById('copy');

    var params = new URLSearchParams((location.hash || '').replace(/^#/, ''));
    if (!params.has('access_token')) {
      params = new URLSearchParams((location.search || '').replace(/^\?/, ''));
    }

    var token = params.get('access_token') || params.get('token') || '';
    var state = params.get('state') || '';
    var oauthError = params.get('error_description') || params.get('error');

    function setStatus(text, cls) {
      statusEl.className = cls || '';
      statusEl.textContent = text;
    }

    function gameReturnUrl() {
      return 'https://appassets.androidplatform.net/assets/index.html#nano_oauth=' +
        encodeURIComponent(token) +
        (state ? ('&nano_state=' + encodeURIComponent(state)) : '');
    }

    function sendToGame() {
      var msg = { type: 'nano_yandex_auth', access_token: token, state: state };
      try {
        if (window.opener && !window.opener.closed) {
          window.opener.postMessage(msg, '*');
          return 'opener';
        }
      } catch (e) {}
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(msg, '*');
          return 'parent';
        }
      } catch (e) {}
      return null;
    }

    function returnToGame() {
      var via = sendToGame();
      if (via === 'opener') {
        setStatus('Готово! Закрываем окно…', 'ok');
        setTimeout(function () { try { window.close(); } catch (e) {} }, 400);
        return;
      }
      // WebView приложения: редирект на страницу игры (НЕ nanoids://)
      setStatus('Возвращаем в игру…', 'ok');
      location.replace(gameReturnUrl());
    }

    if (oauthError) {
      setStatus('Ошибка Яндекса: ' + oauthError, 'err');
      return;
    }
    if (!token) {
      setStatus('Токен не найден. Закрой окно и войди снова.', 'err');
      return;
    }

    // авто: postMessage или сразу в игру
    var via = sendToGame();
    if (via === 'opener') {
      setStatus('Токен передан. Можно закрыть окно.', 'ok');
      setTimeout(function () { try { window.close(); } catch (e) {} }, 600);
    } else {
      setStatus('Нажми «Вернуться в игру».', 'ok');
      // в WebView сразу пробуем редирект
      var ua = navigator.userAgent || '';
      if (/; wv\)/i.test(ua) || /Android/i.test(ua)) {
        setTimeout(returnToGame, 300);
      }
    }

    confirmBtn.addEventListener('click', returnToGame);
    copyBtn.style.display = 'block';
    copyBtn.addEventListener('click', function () {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(token).then(function () {
          setStatus('Токен скопирован. Вставь в игре: Настр. → Вставить токен', 'ok');
        }).catch(function () {
          setStatus('Не удалось скопировать.', 'err');
        });
      }
    });
  })();
  </script>
</body>
</html>
